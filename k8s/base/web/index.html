<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>k8s-attack-defense-lab notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; }
    button { padding: .5rem 1rem; }
    li { padding: .25rem 0; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <p>Demo app: <code>web (nginx) &rarr; api (Node.js) &rarr; db (PostgreSQL)</code></p>
  <form id="form">
    <input id="text" maxlength="500" placeholder="Write a note" required>
    <button>Add</button>
  </form>
  <p id="error"></p>
  <ul id="notes"></ul>
  <script>
    const list = document.getElementById("notes");
    const error = document.getElementById("error");

    async function load() {
      const res = await fetch("/api/notes");
      if (!res.ok) { error.textContent = "API error: " + res.status; return; }
      error.textContent = "";
      list.replaceChildren(...(await res.json()).map((note) => {
        const li = document.createElement("li");
        // textContent, not innerHTML: note text is untrusted input (XSS).
        li.textContent = note.text;
        return li;
      }));
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("text");
      await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });
      input.value = "";
      load();
    });

    load();
  </script>
</body>
</html>
