server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to "web". Requests to /api/ are forwarded
    # to the "api" Service; "web" has no reason to reach the database at all.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
