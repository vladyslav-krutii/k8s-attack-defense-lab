# LAB-ONLY credential, committed on purpose so the lab is reproducible.
# In a real project a Secret manifest never goes into git in plain form:
# use External Secrets Operator, Sealed Secrets or SOPS instead.
# Also remember: a Secret is base64-ENCODED, not encrypted. Anyone who can
# "get secrets" in this namespace can read it (that is scenario 2).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  password: lab-only-not-a-real-password
