# Layer 4 (scenario 4): the DB password reaches api and db as a read-only
# FILE from the Secret, never as an environment variable.
#
# Why a file beats an env var with the same content:
#  - env vars are inherited by every child process (a shell, a debugger, an
#    error reporter) and show up in /proc/<pid>/environ, crash dumps and
#    "printenv" in any "kubectl exec" session;
#  - a file has to be opened on purpose, has an owner and a mode, and is
#    updated in place when the Secret is rotated (an env var never changes).
#
# defaultMode 288 = octal 0440: readable by the owner (root) and the pod's
# fsGroup, nobody else. Written in decimal because YAML tools disagree on
# whether "0440" is octal. readOnly: true on the mount, too.
#
# "$patch: delete" removes the base's env var (env entries merge by name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      securityContext:
        # The Secret file is group-owned by GID 1000, the api's group.
        fsGroup: 1000
      containers:
        - name: api
          env:
            - name: PGPASSWORD
              $patch: delete
            # Read by server.ts for every new DB connection.
            - name: PGPASSWORD_FILE
              value: /etc/db-credentials/password
          volumeMounts:
            - name: db-credentials
              mountPath: /etc/db-credentials
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            defaultMode: 288
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_PASSWORD
              $patch: delete
            # Supported by the official postgres image entrypoint.
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/db-credentials/password
          volumeMounts:
            - name: db-credentials
              mountPath: /etc/db-credentials
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: db-credentials
            defaultMode: 288
