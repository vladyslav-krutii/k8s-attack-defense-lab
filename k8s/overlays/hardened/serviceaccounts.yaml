# Layer 2: one ServiceAccount per workload, none of them bound to any Role.
#
# Why dedicated accounts if they have no permissions? Identity per workload:
# audit log entries, future RBAC grants and NetworkPolicy-like tooling can
# tell web, api and db apart. Everything sharing "default" means any grant
# given to one workload silently applies to all of them.
#
# automountServiceAccountToken: false - none of these apps call the
# Kubernetes API, so no API token is put into their filesystem at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
automountServiceAccountToken: false
