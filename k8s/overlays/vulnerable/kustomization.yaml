# VULNERABLE overlay: the base app plus realistic misconfigurations.
# Every patch here is something seen in real clusters, usually added
# "temporarily" to make something work. Each one maps to a scenario in
# scenarios/0N-*/ and is undone by the hardened overlay.
#
# LOCAL LAB ONLY. Never apply this to a shared or real cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base
  # Scenario 2: service account "web" bound to the built-in "edit" role.
  - rbac-web.yaml

patches:
  # Pod Security Admission: nothing enforced, but warn/audit at "restricted"
  # so "kubectl apply" prints what the hardened overlay will have to fix.
  - path: namespace-psa.yaml
  # Scenario 1: web runs privileged, as root, with the node's / mounted.
  - path: patches/01-web-privileged-hostpath.yaml
  # Scenario 2: web uses that service account, token auto-mounted.
  - path: patches/02-web-serviceaccount.yaml
  # Scenario 4: api takes the DB password from a ConfigMap, as an env var.
  # (db keeps the base's secretKeyRef env var - the common "default" that
  # still puts the password into the environment of every process.)
  - path: patches/04-api-password-in-configmap.yaml

# Scenario 4: the password copied into a ConfigMap. ConfigMaps are readable
# with the built-in "view" role, which is designed to hide Secrets.
configMapGenerator:
  - name: api-config
    literals:
      - PGPASSWORD=lab-only-not-a-real-password

# Scenario 5 is also by absence: like the base, no container sets
# readOnlyRootFilesystem or resource limits, and web already runs as root
# (scenario 1 patch).
#
# Scenario 3 is a misconfiguration by ABSENCE: this overlay defines no
# NetworkPolicy, so every pod can reach every other pod on every port.
# Nothing to patch - which is exactly why it is so common.
