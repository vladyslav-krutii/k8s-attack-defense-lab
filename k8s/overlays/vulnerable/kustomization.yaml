# VULNERABLE overlay: the base app plus realistic misconfigurations.
# Every patch here is something seen in real clusters, usually added
# "temporarily" to make something work. Each one maps to a scenario in
# scenarios/0N-*/ and is undone by the hardened overlay.
#
# LOCAL LAB ONLY. Never apply this to a shared or real cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - ../../base
  # Scenario 2: service account "web" bound to the built-in "edit" role.
  - rbac-web.yaml

patches:
  # Pod Security Admission: nothing enforced, but warn/audit at "restricted"
  # so "kubectl apply" prints what the hardened overlay will have to fix.
  - path: namespace-psa.yaml
  # Scenario 1: web runs privileged, as root, with the node's / mounted.
  - path: patches/01-web-privileged-hostpath.yaml
  # Scenario 2: web uses that service account, token auto-mounted.
  - path: patches/02-web-serviceaccount.yaml
