# Scenario 2: run web as the over-permissive "web" service account, with its
# API token mounted at /var/run/secrets/kubernetes.io/serviceaccount/.
# nginx never talks to the Kubernetes API, so it has no use for a token -
# but an attacker inside the container does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      serviceAccountName: web
      automountServiceAccountToken: true
