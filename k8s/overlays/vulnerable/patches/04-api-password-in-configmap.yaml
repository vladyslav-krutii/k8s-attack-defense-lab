# Scenario 4: the database password lives in a ConfigMap and reaches the
# api as an environment variable.
# Typical origin: "all app settings go into one ConfigMap" - host, user,
# database name... and the password, because it is just another setting.
#
# The base reads PGPASSWORD from the Secret (secretKeyRef); this patch
# swaps the source to the ConfigMap generated in kustomization.yaml.
# "secretKeyRef: null" removes the base field (strategic merge patch), or
# the entry would end up with two sources and fail validation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: null
                configMapKeyRef:
                  name: api-config
                  key: PGPASSWORD
