# Helm values for Falco (chart 9.2.2 = Falco 0.45.2).
# Only what differs from the chart defaults is set here.

driver:
  # modern_ebpf: a CO-RE eBPF probe compiled into the Falco binary. It needs
  # kernel >= 5.8 and BTF (/sys/kernel/btf/vmlinux) - both checked on the
  # kind nodes (they share the WSL2 kernel 6.18). No kernel module to build
  # or load, nothing downloaded at start-up.
  kind: modern_ebpf
  modernEbpf:
    # Deliberately false, but Falco is still NOT privileged: the security
    # context is set explicitly in containerSecurityContext below, which
    # takes precedence over everything the chart would generate.
    #
    # Why not "leastPrivileged: true"? In chart 9.2.2 it also adds the
    # annotation container.apparmor.security.beta.kubernetes.io/falco, which
    # Kubernetes deprecated in 1.30 (warning on every install). The chart has
    # no switch for it, so we write the same least-privileged context
    # ourselves, with the securityContext.appArmorProfile field instead.
    leastPrivileged: false

# Least privilege by hand: only the capabilities the modern eBPF probe needs
# (CAP_BPF, CAP_PERFMON, CAP_SYS_RESOURCE, CAP_SYS_PTRACE), no "privileged".
# A runtime sensor sees every syscall on the node - it is a juicy target
# itself, so it should not be more powerful than necessary.
# Do not empty this block: with leastPrivileged=false the chart would fall
# back to privileged: true. "make falco" checks that it did not.
containerSecurityContext:
  # Same as the chart's annotation: the default container AppArmor profile
  # would block the bpf() calls.
  appArmorProfile:
    type: Unconfined
  capabilities:
    add: [BPF, SYS_RESOURCE, PERFMON, SYS_PTRACE]

falco:
  # Default "first": once one rule matches an event, later rules are not
  # evaluated for it. The stock rule "Unexpected connection to K8s API Server
  # from container" is loaded before our rules.d/ file, so it shadowed the
  # lab rule for web -> API server (scenario 2) and only the stock alert
  # appeared. "all" evaluates every rule (an event can raise two alerts).
  # Trade-off: incubating option, more CPU per event - fine for this lab,
  # load-test it before production.
  rule_matching: all

# Flush every alert line immediately, so "kubectl logs" shows events in real
# time (useful for the scenario demos; costs a little throughput).
tty: true

falcoctl:
  artifact:
    # Rules are installed once at start-up by the init container, but the
    # "follow" sidecar that silently pulls rule updates at runtime is off:
    # detection behaviour should only change through a commit, not on its own.
    follow:
      enabled: false
