# Scenario 4: a ConfigMap must not carry credentials. The built-in "view"
# role (handed to developers, dashboards, CI read-only accounts) reads every
# ConfigMap but no Secret - so a password in a ConfigMap silently widens who
# can read it. ConfigMaps are also printed in full by "kubectl describe".
#
# Trade-off: only the KEY names are checked (PGPASSWORD, api_token, ...).
# A credential hidden in a value (DATABASE_URL=postgres://u:pw@db/x) or under
# an innocent name passes. Secret scanners in CI (gitleaks, trufflehog) cover
# values; this policy is a cheap guard rail at admission.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-configmaps
  annotations:
    policies.kyverno.io/title: Disallow credential-like keys in ConfigMaps
    policies.kyverno.io/category: k8s-attack-defense-lab (scenario 4)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      ConfigMap keys must not look like credentials (password, secret,
      token, api key, private key). Use a Secret instead.
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  variables:
    - name: keys
      expression: >-
        object.?data.orValue({}).map(k, k) +
        object.?binaryData.orValue({}).map(k, k)
  validations:
    - expression: >-
        variables.keys.all(k,
        !k.matches('(?i)(passw(or)?d|secret|token|api_?key|private_?key|credential)'))
      message: >-
        This ConfigMap has a credential-like key. ConfigMaps are readable
        with the "view" role; store credentials in a Secret.
