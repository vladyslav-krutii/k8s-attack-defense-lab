# Scenario 4: credentials must not reach a container as environment
# variables. Three ways in, three checks:
#  1. a literal value for a secret-looking name (PASSWORD=..., API_KEY=...):
#     the credential sits in the pod spec, readable with the "view" role;
#  2. env[].valueFrom.secretKeyRef;
#  3. envFrom[].secretRef.
# 2 and 3 keep the value out of the spec, but it still lands in the process
# environment: inherited by every child process, visible in
# /proc/<pid>/environ and in "printenv" from any "kubectl exec".
# The fix is a Secret volume (a read-only file) - see the hardened overlay.
#
# Trade-off: secretKeyRef env vars are the most common pattern in the wild
# and much better than a literal. Enforcing 2 and 3 breaks many
# off-the-shelf charts; a cluster-wide rollout would start in Audit. The
# hardened namespace already uses files, so it enforces all three.
#
# Names ending in _FILE are exempt from check 1: their value is a path
# (PGPASSWORD_FILE=/etc/db-credentials/password), the convention used by the
# postgres image and many others.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-env
  annotations:
    policies.kyverno.io/title: Disallow credentials in environment variables
    policies.kyverno.io/category: k8s-attack-defense-lab (scenario 4)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Containers must not receive credentials as environment variables:
      no literal values for secret-like names, no secretKeyRef and no
      envFrom secretRef. Mount the Secret as a read-only file instead.
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    # RE2 syntax, case-insensitive. Matches anywhere in the name.
    - name: secretName
      expression: "'(?i)(passw(or)?d|secret|token|api_?key|private_?key|credential)'"
  validations:
    - expression: >-
        variables.allContainers.all(c, c.?env.orValue([]).all(e,
          !has(e.value) || e.value == '' || e.name.endsWith('_FILE') ||
          !e.name.matches(variables.secretName)))
      message: >-
        A credential-like environment variable has a literal value in the
        pod spec. Put it in a Secret and mount it as a file.
    - expression: >-
        variables.allContainers.all(c, c.?env.orValue([]).all(e,
          !e.?valueFrom.?secretKeyRef.hasValue()))
      message: >-
        Secrets must not be passed as environment variables (secretKeyRef).
        Mount the Secret as a read-only file instead.
    - expression: >-
        variables.allContainers.all(c, c.?envFrom.orValue([]).all(f,
          !has(f.secretRef)))
      message: >-
        Secrets must not be passed as environment variables (envFrom
        secretRef). Mount the Secret as a read-only file instead.
