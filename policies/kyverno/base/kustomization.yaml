# The policies, as written and as tested by "kyverno test".
# Not applied directly: see ../audit and ../enforce.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - disallow-privileged-containers.yaml
  - disallow-host-path.yaml
  - disallow-latest-tag.yaml
  - require-resource-limits.yaml
  - require-run-as-nonroot.yaml
  - disallow-secrets-in-env.yaml
  - disallow-secrets-in-configmaps.yaml
