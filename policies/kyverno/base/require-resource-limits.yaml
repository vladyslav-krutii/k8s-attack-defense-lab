# Resource exhaustion (scenario 5): CPU and memory limits required.
# Without limits one compromised or buggy container (cryptominer, fork bomb,
# memory leak) can starve every other pod on the node - a denial of service
# that crosses tenant boundaries.
#
# Trade-off: CPU limits cause CFS throttling, and many teams set only CPU
# requests plus a memory limit. This lab requires both limits because the
# threat being modelled is abuse, not performance tuning.
# Ephemeral containers are skipped: the API does not allow them to set
# resources at all.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: k8s-attack-defense-lab (scenario 5)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container and init container must set resources.limits.cpu and
      resources.limits.memory.
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: containers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
        has(c.resources) && has(c.resources.limits) &&
        'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: >-
        CPU and memory limits are required: set resources.limits.cpu and
        resources.limits.memory in every container and init container.
