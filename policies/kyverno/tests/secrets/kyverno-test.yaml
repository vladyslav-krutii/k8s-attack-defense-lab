# Offline tests for the scenario 4 policies (part of "make policy-test").
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scenario-4-secrets
policies:
  - ../../base/disallow-secrets-in-env.yaml
  - ../../base/disallow-secrets-in-configmaps.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    policy: disallow-secrets-in-env
    kind: Pod
    result: fail
    resources:
      - bad-pod-literal-password
      - bad-pod-init-literal-api-key
      - bad-pod-secretkeyref
  - isValidatingPolicy: true
    policy: disallow-secrets-in-env
    kind: Deployment
    result: fail
    resources:
      - bad-deployment-envfrom-secret
  - isValidatingPolicy: true
    policy: disallow-secrets-in-env
    kind: Pod
    result: pass
    resources:
      - good-pod-secret-file
  - isValidatingPolicy: true
    policy: disallow-secrets-in-configmaps
    kind: ConfigMap
    result: fail
    resources:
      - bad-configmap-password
      - bad-configmap-binary-private-key
  - isValidatingPolicy: true
    policy: disallow-secrets-in-configmaps
    kind: ConfigMap
    result: pass
    resources:
      - good-configmap
