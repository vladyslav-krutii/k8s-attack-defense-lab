# Fixtures for the scenario 4 policies. bad-* must FAIL, good-* must PASS.
# Password from a mounted Secret file; *_FILE env var holding a path.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-secret-file
spec:
  containers:
  - name: app
    image: registry.example/app:1.0
    env:
    - {name: PGHOST, value: db}
    - {name: PGPASSWORD_FILE, value: /etc/db-credentials/password}
    - {name: TOKEN_TTL, valueFrom: {configMapKeyRef: {name: app, key: ttl}}}
    volumeMounts:
    - {name: creds, mountPath: /etc/db-credentials, readOnly: true}
  volumes:
  - name: creds
    secret: {secretName: db-credentials, defaultMode: 288}
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-literal-password
spec:
  containers:
  - name: app
    image: registry.example/app:1.0
    env:
    - {name: DB_PASSWORD, value: hunter2}
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-init-literal-api-key
spec:
  initContainers:
  - name: init
    image: registry.example/init:1.0
    env:
    - {name: Stripe_ApiKey, value: sk_test_lab}
  containers:
  - name: app
    image: registry.example/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-secretkeyref
spec:
  containers:
  - name: app
    image: registry.example/app:1.0
    env:
    - name: PGPASSWORD
      valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment-envfrom-secret
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
      - name: app
        image: registry.example/app:1.0
        envFrom:
        - secretRef: {name: db-credentials}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: good-configmap
data:
  default.conf: "server { listen 8080; }"
  PGHOST: db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bad-configmap-password
data:
  PGHOST: db
  PGPASSWORD: lab-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bad-configmap-binary-private-key
binaryData:
  tls_private_key.pem: bGFi
